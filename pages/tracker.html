<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYBERA — Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: { cyan: '#00ffff', purple: '#aa00ff', blue: '#0088ff', green: '#00ff66' },
            hangar: { dark: '#0a0e17', mid: '#111827', light: '#1a2332' }
          },
          fontFamily: {
            mono: ['"Share Tech Mono"', 'monospace'],
            display: ['"Orbitron"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .tracker-panel { background: rgba(0,8,18,0.5); border: 1px solid rgba(0,255,255,0.12); border-radius: 0.5rem; backdrop-filter: blur(8px); }
    .tracker-panel-purple { background: rgba(20,5,30,0.5); border: 1px solid rgba(170,0,255,0.15); border-radius: 0.5rem; backdrop-filter: blur(8px); }
    .filter-btn { background: transparent; border: 1px solid rgba(0,255,255,0.2); color: #666; padding: 0.25rem 0.75rem; border-radius: 0.25rem; font-size: 0.55rem; letter-spacing: 0.1em; cursor: pointer; transition: all 0.3s; }
    .filter-btn:hover { border-color: rgba(0,255,255,0.5); color: #aaa; }
    .filter-btn.active { border-color: #00ffff; color: #00ffff; background: rgba(0,255,255,0.08); }
    .review-card { background: rgba(0,8,18,0.6); border: 1px solid rgba(0,255,255,0.1); border-radius: 0.5rem; overflow: hidden; transition: border-color 0.3s; }
    .review-card:hover { border-color: rgba(0,255,255,0.3); }
    .review-img { width: 100%; height: 100px; object-fit: cover; display: flex; align-items: center; justify-content: center; }
    .review-card-body { padding: 0.5rem 0.6rem; }
    .review-stars { color: #ffcc00; font-size: 0.55rem; margin-bottom: 0.25rem; }
    .review-name { color: #aaa; font-size: 0.6rem; margin-bottom: 0.15rem; }
    .review-text { color: #888; font-size: 0.55rem; font-style: italic; }
  </style>
</head>
<body class="bg-black text-white overflow-hidden m-0 p-0 font-mono">

  <!-- WALLPAPER: Capo 4.jpeg -->
  <div class="fixed inset-0 w-screen h-screen z-0"
       style="background: url('/wallpapers/Capo 4.jpeg') center/cover no-repeat;">
  </div>

  <!-- NAV -->
  <nav class="fixed top-0 left-0 right-0 z-20 pointer-events-auto">
    <div class="flex items-center justify-between px-6 py-4">
      <a href="/" class="flex items-center gap-3 no-underline">
        <svg class="w-8 h-8 text-neon-cyan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span class="text-neon-cyan font-display font-bold text-lg tracking-widest neon-text">KYBERA</span>
      </a>
      <div class="flex items-center gap-6">
        <a href="/configurator" class="text-sm text-gray-400 hover:text-neon-cyan transition-colors duration-300 tracking-wider no-underline">CONFIGURATOR</a>
        <a href="/tracker" class="text-sm text-neon-cyan transition-colors duration-300 tracking-wider no-underline">TRACKER</a>
      </div>
    </div>
  </nav>

  <!-- CONTENT: Two panels with gap -->
  <div class="fixed inset-0 w-screen h-screen z-10 pointer-events-auto overflow-y-auto"
       style="padding: 5rem 3rem 2rem;">
    <div class="flex flex-col lg:flex-row gap-8 max-w-7xl mx-auto animate-fade-in">

      <!-- LEFT PANEL: Customer References -->
      <div class="flex-1 tracker-panel p-5">
        <p class="text-[0.55rem] text-cyan-400/60 tracking-widest mb-4 text-center">[ CUSTOMER REFERENCES ]</p>

        <!-- Filter buttons -->
        <div class="flex gap-2 mb-4 justify-center flex-wrap">
          <button class="filter-btn active" data-filter="all">ALL</button>
          <button class="filter-btn" data-filter="blue">CYAN</button>
          <button class="filter-btn" data-filter="purple">AMETHYST</button>
          <button class="filter-btn" data-filter="green">EMERALD</button>
          <button class="filter-btn" data-filter="red">CRIMSON</button>
        </div>

        <!-- Reviews grid -->
        <div id="reviews-grid" class="grid grid-cols-2 md:grid-cols-3 gap-3">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- RIGHT PANEL: Order Tracking -->
      <div class="w-full lg:w-80 flex flex-col gap-4">

        <!-- Order Code -->
        <div class="tracker-panel-purple p-5 text-center">
          <p class="text-[0.5rem] text-purple-400/60 tracking-widest mb-2">[ ORDER TRACKING ]</p>
          <div class="font-display text-2xl text-neon-cyan tracking-[0.2em] mb-2"
               style="text-shadow: 0 0 15px rgba(0,255,255,0.4);">
            <span id="tracking-code">#KYB-----</span>
          </div>
          <div class="w-full h-2 bg-gray-800 rounded-full overflow-hidden mt-3">
            <div id="progress-bar" class="h-full bg-neon-cyan rounded-full transition-all duration-500"
                 style="width: 10%; box-shadow: 0 0 8px rgba(0,255,255,0.5);"></div>
          </div>
          <p id="progress-text" class="text-[0.5rem] text-gray-500 mt-2 tracking-wider">10% COMPLETE</p>
        </div>

        <!-- Timeline -->
        <div class="tracker-panel-purple p-5 flex-1">
          <p class="text-[0.5rem] text-purple-400/60 tracking-widest mb-4">[ PROGRESS TRACKER ]</p>
          <div id="timeline" class="flex flex-col gap-4">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- Config Summary -->
        <div class="tracker-panel-purple p-4">
          <p class="text-[0.5rem] text-purple-400/60 tracking-widest mb-3 text-center">[ YOUR CONFIG ]</p>
          <div class="flex flex-col gap-2 text-[0.65rem]">
            <div class="flex justify-between">
              <span class="text-gray-500">Sleeve:</span>
              <span id="detail-sleeve" class="text-neon-cyan">Brushed Steel</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-500">Crystal:</span>
              <span id="detail-crystal" class="text-neon-cyan">Blue</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-500">Status:</span>
              <span id="detail-status" class="text-yellow-400">Forging</span>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
          <a href="/configurator" class="btn-cyber flex-1 py-3 text-center no-underline">
            <span class="text-[0.6rem] tracking-wider">NEW ORDER</span>
          </a>
          <a href="/" class="btn-ensamblar flex-1 py-3 text-center no-underline">
            <span class="text-[0.6rem] tracking-wider">HOME</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const CRYSTAL_NAMES = {
      blue: 'Blue', green: 'Green', purple: 'Purple',
      white: 'White', red: 'Red', black: 'Black', yellow: 'Yellow'
    };
    const CRYSTAL_HEX = {
      blue: '#00ccff', green: '#00ff66', purple: '#ee66ff',
      white: '#ffffff', red: '#ff4444', black: '#333333', yellow: '#ffcc00'
    };
    const SLEEVE_NAMES = {
      brushedSteel: 'Brushed Steel', darkBronzed: 'Dark Bronzed', ancientStone: 'Ancient Stone'
    };

    const REVIEWS = [
      { name: 'Anakin S.', crystal: 'blue', stars: 5, text: 'Incredible power! Best build quality.', color: '#00ccff' },
      { name: 'Ahsoka T.', crystal: 'green', stars: 5, text: 'Perfectly balanced, as all things should be.', color: '#00ff66' },
      { name: 'Mace W.', crystal: 'purple', stars: 5, text: 'Absolutely perfect craftsmanship.', color: '#ee66ff' },
      { name: 'Luke S.', crystal: 'green', stars: 5, text: 'Lights up the night beautifully.', color: '#00ff66' },
      { name: 'Rey', crystal: 'blue', stars: 5, text: 'Great build quality and detail.', color: '#00ccff' },
      { name: 'Kylo R.', crystal: 'red', stars: 5, text: 'Unstable but incredibly powerful.', color: '#ff4444' },
      { name: 'Obi-Wan K.', crystal: 'blue', stars: 5, text: 'The negotiations were short. Great saber.', color: '#00ccff' },
      { name: 'Yoda', crystal: 'green', stars: 5, text: 'Strong with the Force, this one is.', color: '#00ff66' },
      { name: 'Darth Vader', crystal: 'red', stars: 5, text: 'Impressive. Most impressive.', color: '#ff4444' },
      { name: 'Qui-Gon J.', crystal: 'green', stars: 5, text: 'At last we will have revenge... of quality.', color: '#00ff66' },
      { name: 'Count D.', crystal: 'red', stars: 5, text: 'Magnificent, magnificent.', color: '#ff4444' },
      { name: 'Kanan J.', crystal: 'blue', stars: 5, text: 'Fascinating weapon. Beyond stars.', color: '#00ccff' },
    ];

    const SUPABASE_URL = 'https://bmfmckurecmrpfaudaxa.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZm1ja3VyZWNtcnBmYXVkYXhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzQzNDcsImV4cCI6MjEwNDU1MDM0N30.iWLNVzHpWf38PU2hak4O6H8PkhnNnzyx5nM9y-wkb0E';
    let supabase = null;
    try {
      if (window.supabase) supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) { console.warn('Supabase init failed:', e); }

    function renderStars(count) {
      return '<span class="review-stars">' + '★'.repeat(count) + '☆'.repeat(5 - count) + '</span>';
    }

    function renderReviews(filter) {
      const grid = document.getElementById('reviews-grid');
      const filtered = filter === 'all' ? REVIEWS : REVIEWS.filter(r => r.crystal === filter);
      grid.innerHTML = filtered.map(r => `
        <div class="review-card" data-crystal="${r.crystal}">
          <div class="review-img" style="background: radial-gradient(ellipse, ${r.color}22 0%, transparent 70%);">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="${r.color}" stroke-width="1.5" opacity="0.6">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div class="review-card-body">
            ${renderStars(r.stars)}
            <p class="review-name">${r.name}</p>
            <p class="review-text">"${r.text}"</p>
          </div>
        </div>
      `).join('');
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderReviews(btn.dataset.filter);
      });
    });

    // Initial render
    renderReviews('all');

    // --- ORDER TRACKING ---
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || localStorage.getItem('kybera_last_order') || 'KYB-----';
    document.getElementById('tracking-code').textContent = '#' + code;

    async function loadTracking() {
      let orderData = null;
      if (supabase && code !== 'KYB-----') {
        try {
          const { data, error } = await supabase.from('orders').select('*').eq('order_code', code).single();
          if (!error && data) orderData = data;
        } catch (e) { console.warn('Supabase fetch failed:', e); }
      }

      const sleeveType = orderData ? orderData.sleeve : 'brushedSteel';
      const crystalType = orderData ? orderData.crystal : 'blue';
      const status = orderData ? orderData.status : 'forging';

      document.getElementById('detail-sleeve').textContent = SLEEVE_NAMES[sleeveType] || 'Brushed Steel';
      document.getElementById('detail-crystal').textContent = CRYSTAL_NAMES[crystalType] || 'Blue';
      document.getElementById('detail-status').textContent = status.charAt(0).toUpperCase() + status.slice(1);

      const statusOrder = ['forging', 'tuning', 'test', 'ship', 'delivered'];
      const currentIdx = statusOrder.indexOf(status);
      const progress = Math.max(10, ((currentIdx + 1) / statusOrder.length) * 100);
      document.getElementById('progress-bar').style.width = progress + '%';
      document.getElementById('progress-text').textContent = Math.round(progress) + '% COMPLETE';

      const stepData = [
        { label: '01 Order Received', status: 'done' },
        { label: '02 Hilt Forging', status: currentIdx >= 1 ? (status === 'forging' ? 'active' : 'done') : (currentIdx === 0 ? 'active' : 'pending') },
        { label: '03 Kyber Core Tuning', status: currentIdx >= 2 ? (status === 'tuning' ? 'active' : 'done') : 'pending' },
        { label: '04 Quality Test', status: currentIdx >= 3 ? (status === 'test' ? 'active' : 'done') : 'pending' },
        { label: '05 Starport Shipping', status: currentIdx >= 4 ? (status === 'ship' || status === 'delivered' ? 'active' : 'pending') : 'pending' }
      ];

      const timelineEl = document.getElementById('timeline');
      timelineEl.innerHTML = stepData.map(s => {
        const dotClass = s.status === 'done' ? 'bg-green-400' : s.status === 'active' ? 'bg-neon-cyan animate-pulse' : 'bg-gray-600';
        const textClass = s.status === 'done' ? 'text-green-400' : s.status === 'active' ? 'text-neon-cyan' : 'text-gray-500';
        const icon = s.status === 'done'
          ? '<svg class="w-3.5 h-3.5 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
          : s.status === 'active'
          ? '<svg class="w-2.5 h-2.5 text-neon-cyan animate-spin ml-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="20"/></svg>'
          : '';
        const statusText = s.status === 'done' ? '<p class="text-[0.4rem] text-green-500/60 tracking-wider mt-0.5">[DONE]</p>'
          : s.status === 'active' ? '<p class="text-[0.4rem] text-cyan-500/60 tracking-wider mt-0.5">[IN PROGRESS]</p>' : '';
        return `<div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full ${dotClass}" style="${s.status !== 'pending' ? 'box-shadow: 0 0 8px rgba(0,255,255,0.4);' : ''}"></div>
          <div class="flex-1">
            <div class="flex items-center gap-2">
              <span class="text-[0.65rem] ${textClass} tracking-wider">${s.label}</span>
              ${icon}
            </div>
            ${statusText}
          </div>
        </div>`;
      }).join('');
    }

    loadTracking();
  </script>
</body>
</html>
