<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYBERA — Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: { cyan: '#00ffff', purple: '#aa00ff', blue: '#0088ff', green: '#00ff66' },
            hangar: { dark: '#0a0e17', mid: '#111827', light: '#1a2332' }
          },
          fontFamily: {
            mono: ['"Share Tech Mono"', 'monospace'],
            display: ['"Orbitron"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .tracker-card { background: rgba(0,8,18,0.45); border: 1px solid rgba(0,255,255,0.12); border-radius: 0.5rem; backdrop-filter: blur(8px); }
    .tracker-card-purple { background: rgba(20,5,30,0.45); border: 1px solid rgba(170,0,255,0.15); border-radius: 0.5rem; backdrop-filter: blur(8px); }
    .star { color: #ffcc00; }
    .star-empty { color: #333; }
  </style>
</head>
<body class="bg-black text-white overflow-hidden m-0 p-0 font-mono">

  <!-- WALLPAPER -->
  <div class="fixed inset-0 w-screen h-screen z-0"
       style="background: url('/wallpapers/Capo 4.jpeg') center/cover no-repeat;">
  </div>

  <!-- NAV -->
  <nav class="fixed top-0 left-0 right-0 z-20 pointer-events-auto">
    <div class="flex items-center justify-between px-6 py-4">
      <a href="/" class="flex items-center gap-3 no-underline">
        <svg class="w-8 h-8 text-neon-cyan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span class="text-neon-cyan font-display font-bold text-lg tracking-widest neon-text">KYBERA</span>
      </a>
      <div class="flex items-center gap-6">
        <a href="/configurator" class="text-sm text-gray-400 hover:text-neon-cyan transition-colors duration-300 tracking-wider no-underline">CONFIGURATOR</a>
        <a href="/tracker" class="text-sm text-neon-cyan transition-colors duration-300 tracking-wider no-underline">TRACKER</a>
      </div>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="fixed inset-0 w-screen h-screen z-10 flex items-center justify-center p-4 md:p-8 pointer-events-auto">
    <div class="flex flex-col lg:flex-row gap-6 max-w-6xl w-full animate-fade-in">

      <!-- LEFT: Mini Saber 3D -->
      <div class="flex-1 flex flex-col items-center justify-center">
        <div class="tracker-card p-6 w-full flex flex-col items-center">
          <p class="text-[0.55rem] text-gray-500 tracking-widest mb-4">[ YOUR LIGHTSABER ]</p>
          <div id="saber-container" class="w-full h-64 rounded-lg overflow-hidden relative"
               style="background: radial-gradient(ellipse, rgba(0,255,255,0.05) 0%, transparent 70%);">
          </div>
          <div id="saber-config" class="mt-4 w-full">
            <div class="flex justify-between text-[0.65rem] mb-1">
              <span class="text-gray-500">Sleeve:</span>
              <span id="detail-sleeve" class="text-neon-cyan">Brushed Steel</span>
            </div>
            <div class="flex justify-between text-[0.65rem] mb-1">
              <span class="text-gray-500">Crystal:</span>
              <span id="detail-crystal" class="text-neon-cyan">Blue</span>
            </div>
            <div class="flex justify-between text-[0.65rem]">
              <span class="text-gray-500">Status:</span>
              <span id="detail-status" class="text-yellow-400">Forging</span>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: Order Tracking -->
      <div class="w-full lg:w-80 flex flex-col gap-4">

        <!-- Order Code -->
        <div class="tracker-card-purple p-5 text-center">
          <p class="text-[0.5rem] text-purple-400/60 tracking-widest mb-2">[ ORDER TRACKING ]</p>
          <div class="font-display text-2xl text-neon-cyan tracking-[0.2em] mb-2"
               style="text-shadow: 0 0 15px rgba(0,255,255,0.4);">
            <span id="tracking-code">#KYB-----</span>
          </div>
          <div class="w-full h-2 bg-gray-800 rounded-full overflow-hidden mt-3">
            <div id="progress-bar" class="h-full bg-neon-cyan rounded-full transition-all duration-500"
                 style="width: 10%; box-shadow: 0 0 8px rgba(0,255,255,0.5);"></div>
          </div>
          <p id="progress-text" class="text-[0.5rem] text-gray-500 mt-2 tracking-wider">10% COMPLETE</p>
        </div>

        <!-- Timeline -->
        <div class="tracker-card-purple p-5 flex-1">
          <p class="text-[0.5rem] text-purple-400/60 tracking-widest mb-4">[ PROGRESS TRACKER ]</p>
          <div id="timeline" class="flex flex-col gap-4">
            <!-- Steps rendered by JS -->
          </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
          <a href="/configurator" class="btn-cyber flex-1 py-3 text-center no-underline">
            <span class="text-[0.6rem] tracking-wider">NEW ORDER</span>
          </a>
          <a href="/" class="btn-ensamblar flex-1 py-3 text-center no-underline">
            <span class="text-[0.6rem] tracking-wider">HOME</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const CRYSTAL_COLORS = {
      blue: '#00ccff', green: '#00ff66', purple: '#ee66ff',
      white: '#ffffff', red: '#ff4444', black: '#333333', yellow: '#ffcc00'
    };
    const CRYSTAL_NAMES = {
      blue: 'Blue', green: 'Green', purple: 'Purple',
      white: 'White', red: 'Red', black: 'Black', yellow: 'Yellow'
    };
    const SLEEVE_NAMES = {
      brushedSteel: 'Brushed Steel', darkBronzed: 'Dark Bronzed', ancientStone: 'Ancient Stone'
    };
    const SLEEVE_COLORS = {
      brushedSteel: { color: 0xaaaaaa, metalness: 0.9, roughness: 0.2 },
      darkBronzed: { color: 0x8c5a2b, metalness: 0.8, roughness: 0.35 },
      ancientStone: { color: 0x444444, metalness: 0.1, roughness: 0.9 }
    };

    const STATUS_STEPS = [
      { key: 'forging', label: '01 Order Received', icon: 'check' },
      { key: 'forging', label: '02 Hilt Forging', icon: 'gear' },
      { key: 'tuning', label: '03 Kyber Core Tuning', icon: 'crystal' },
      { key: 'test', label: '04 Quality Test', icon: 'test' },
      { key: 'ship', label: '05 Starport Shipping', icon: 'ship' }
    ];

    const SUPABASE_URL = 'https://bmfmckurecmrpfaudaxa.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZm1ja3VyZWNtcnBmYXVkYXhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzQzNDcsImV4cCI6MjEwNDU1MDM0N30.iWLNVzHpWf38PU2hak4O6H8PkhnNnzyx5nM9y-wkb0E';
    let supabase = null;
    try {
      if (window.supabase) supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) { console.warn('Supabase init failed:', e); }

    // --- 3D MINI SABER ---
    const container = document.getElementById('saber-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.01, 1000);
    camera.position.set(4, 2.5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    const renderTarget = new THREE.WebGLRenderTarget(container.clientWidth, container.clientHeight, {
      format: THREE.RGBAFormat, type: THREE.UnsignedByteType
    });
    const composer = new EffectComposer(renderer, renderTarget);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(container.clientWidth, container.clientHeight), 1.2, 0.4, 0.85));
    composer.addPass(new OutputPass());

    scene.add(new THREE.AmbientLight(0x334455, 1.8));
    scene.add(new THREE.HemisphereLight(0x4488cc, 0x221122, 1.0));
    const keyLight = new THREE.DirectionalLight(0x6699cc, 2.0);
    keyLight.position.set(5, 10, 5);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xcc8844, 1.2);
    fillLight.position.set(-5, 4, -3);
    scene.add(fillLight);

    function buildSaber(sleeveType, crystalType) {
      const group = new THREE.Group();
      const metalMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.85, roughness: 0.25 });
      const sleeve = SLEEVE_COLORS[sleeveType] || SLEEVE_COLORS.brushedSteel;

      // Emitter
      const emBase = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.72, 0.375, 32), metalMat.clone());
      emBase.rotation.z = Math.PI / 2;
      group.add(emBase);
      const emTop = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 0.45, 32), metalMat.clone());
      emTop.rotation.z = Math.PI / 2;
      emTop.position.x = 0.42;
      group.add(emTop);

      // Crystal
      const crystalColor = new THREE.Color(CRYSTAL_COLORS[crystalType] || '#00ccff');
      const crystalMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.5, 0), new THREE.MeshStandardMaterial({
        color: crystalColor, emissive: crystalColor, emissiveIntensity: 1.2, metalness: 0.1, roughness: 0.1, transparent: true, opacity: 0.9
      }));
      crystalMesh.scale.set(1, 1.3, 1);
      group.add(crystalMesh);

      // Sleeve
      const sleeveMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.93, 0.675, 10.2, 32), new THREE.MeshStandardMaterial({
        color: sleeve.color, metalness: sleeve.metalness, roughness: sleeve.roughness
      }));
      sleeveMesh.rotation.z = Math.PI / 2;
      group.add(sleeveMesh);

      // srTop
      const srTop = new THREE.Mesh(new THREE.TorusGeometry(0.96, 0.0525, 8, 32), metalMat.clone());
      srTop.rotation.y = Math.PI / 2;
      srTop.position.x = 4.59;
      group.add(srTop);

      // Grooves
      for (let i = 0; i < 8; i++) {
        const g = new THREE.Mesh(new THREE.TorusGeometry(0.87 - (i / 8) * 0.18, 0.018, 6, 32), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.6, roughness: 0.5 }));
        g.rotation.y = Math.PI / 2;
        g.position.x = -4.08 + i * 1.122;
        group.add(g);
      }

      // Grip
      const gripBase = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.78, 3.06, 32), metalMat.clone());
      gripBase.material.color.set(0x666666);
      gripBase.rotation.z = Math.PI / 2;
      group.add(gripBase);
      for (let i = 0; i < 4; i++) {
        const r = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.045, 8, 32), metalMat.clone());
        r.rotation.y = Math.PI / 2;
        r.position.x = -1.53 + i * 0.765;
        group.add(r);
      }
      const pommel = new THREE.Mesh(new THREE.CylinderGeometry(0.825, 0.975, 0.525, 32), metalMat.clone());
      pommel.rotation.z = Math.PI / 2;
      pommel.position.x = -1.53;
      group.add(pommel);
      const pommelRing = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.06, 8, 32), metalMat.clone());
      pommelRing.rotation.y = Math.PI / 2;
      pommelRing.position.x = -1.53;
      group.add(pommelRing);

      // Blade (full, static)
      const bladeMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.06, 9.0, 16), new THREE.MeshStandardMaterial({
        color: crystalColor, emissive: crystalColor, emissiveIntensity: 3.0, transparent: true, opacity: 0.85, side: THREE.DoubleSide
      }));
      bladeMesh.rotation.z = Math.PI / 2;
      bladeMesh.position.x = -5.25;
      group.add(bladeMesh);
      const bladeGlow = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.12, 9.0, 16), new THREE.MeshBasicMaterial({
        color: crystalColor, transparent: true, opacity: 0.15, side: THREE.DoubleSide
      }));
      bladeGlow.rotation.z = Math.PI / 2;
      bladeGlow.position.x = -5.25;
      group.add(bladeGlow);

      // Crystal light
      const cLight = new THREE.PointLight(crystalColor, 2.0, 10, 2);
      cLight.position.set(0, 0, 0);
      group.add(cLight);

      return group;
    }

    // --- READ ORDER DATA ---
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || localStorage.getItem('kybera_last_order') || 'KYB-----';
    document.getElementById('tracking-code').textContent = '#' + code;

    let orderData = null;
    if (supabase && code !== 'KYB-----') {
      try {
        const { data, error } = await supabase.from('orders').select('*').eq('order_code', code).single();
        if (!error && data) orderData = data;
      } catch (e) { console.warn('Supabase fetch failed:', e); }
    }

    const sleeveType = orderData ? orderData.sleeve : 'brushedSteel';
    const crystalType = orderData ? orderData.crystal : 'blue';
    const status = orderData ? orderData.status : 'forging';

    // Update details
    document.getElementById('detail-sleeve').textContent = SLEEVE_NAMES[sleeveType] || 'Brushed Steel';
    document.getElementById('detail-crystal').textContent = CRYSTAL_NAMES[crystalType] || 'Blue';
    document.getElementById('detail-status').textContent = status.charAt(0).toUpperCase() + status.slice(1);

    // Build 3D saber
    const saber = buildSaber(sleeveType, crystalType);
    saber.position.y = 0.5;
    scene.add(saber);

    // --- TIMELINE ---
    const statusOrder = ['forging', 'tuning', 'test', 'ship', 'delivered'];
    const currentIdx = statusOrder.indexOf(status);
    const progress = Math.max(10, ((currentIdx + 1) / statusOrder.length) * 100);
    document.getElementById('progress-bar').style.width = progress + '%';
    document.getElementById('progress-text').textContent = Math.round(progress) + '% COMPLETE';

    const timelineEl = document.getElementById('timeline');
    const stepData = [
      { label: '01 Order Received', status: 'done' },
      { label: '02 Hilt Forging', status: currentIdx >= 1 ? (status === 'forging' ? 'active' : 'done') : (currentIdx === 0 ? 'active' : 'pending') },
      { label: '03 Kyber Core Tuning', status: currentIdx >= 2 ? (status === 'tuning' ? 'active' : 'done') : 'pending' },
      { label: '04 Quality Test', status: currentIdx >= 3 ? (status === 'test' ? 'active' : 'done') : 'pending' },
      { label: '05 Starport Shipping', status: currentIdx >= 4 ? (status === 'ship' || status === 'delivered' ? 'active' : (status === 'delivered' ? 'done' : 'pending')) : 'pending' }
    ];

    timelineEl.innerHTML = stepData.map(s => {
      const dotClass = s.status === 'done' ? 'bg-green-400' : s.status === 'active' ? 'bg-neon-cyan animate-pulse' : 'bg-gray-600';
      const textClass = s.status === 'done' ? 'text-green-400' : s.status === 'active' ? 'text-neon-cyan' : 'text-gray-500';
      const icon = s.status === 'done'
        ? '<svg class="w-3.5 h-3.5 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
        : s.status === 'active'
        ? '<svg class="w-2.5 h-2.5 text-neon-cyan animate-spin ml-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="60" stroke-dashoffset="20"/></svg>'
        : '';
      const statusText = s.status === 'done' ? '<p class="text-[0.4rem] text-green-500/60 tracking-wider mt-0.5">[DONE]</p>'
        : s.status === 'active' ? '<p class="text-[0.4rem] text-cyan-500/60 tracking-wider mt-0.5">[IN PROGRESS]</p>' : '';
      return `<div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full ${dotClass}" style="${s.status !== 'pending' ? 'box-shadow: 0 0 8px rgba(0,255,255,0.4);' : ''}"></div>
        <div class="flex-1">
          <div class="flex items-center gap-2">
            <span class="text-[0.65rem] ${textClass} tracking-wider">${s.label}</span>
            ${icon}
          </div>
          ${statusText}
        </div>
      </div>`;
    }).join('');

    // --- ANIMATE ---
    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t = performance.now() * 0.001;
      saber.rotation.y = Math.sin(t * 0.3) * 0.2;
      saber.position.y = 0.5 + Math.sin(t * 0.8) * 0.05;
      composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
    });
  </script>
</body>
</html>
