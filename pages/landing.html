<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYBERA — Inicio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: { cyan: '#00ffff', purple: '#aa00ff', blue: '#0088ff', green: '#00ff66' }
          },
          fontFamily: {
            mono: ['"Share Tech Mono"', 'monospace'],
            display: ['"Orbitron"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-black text-white overflow-hidden m-0 p-0 font-mono">

  <!-- WALLPAPER: hangar -->
  <div class="fixed inset-0 w-screen h-screen z-0"
       style="background: url('/wallpapers/capa 1,2,3.jpeg') center/cover no-repeat;">
  </div>

  <!-- NAVBAR -->
  <nav class="landing-nav fixed top-0 left-0 w-full z-30 flex items-center justify-between px-6 md:px-10 py-4">
    <a href="/" class="font-display text-neon-cyan text-lg tracking-widest neon-text" style="text-decoration:none;">KYBERA</a>
    <div class="flex items-center gap-8">
      <a href="/">Inicio</a>
      <a href="#about">Sobre KYBERA</a>
      <a href="/gallery">Galería</a>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="fixed inset-0 w-screen h-screen z-10 flex flex-col items-center justify-center pointer-events-auto">

    <!-- Hero Content — centered over the holographic platform -->
    <div class="text-center animate-fade-in relative z-10 px-4">
      <h1 class="font-display text-3xl md:text-5xl lg:text-6xl font-black text-white mb-2 tracking-wider"
          style="text-shadow: 0 0 40px rgba(0,255,255,0.35), 0 0 80px rgba(0,255,255,0.12);">
        BIENVENIDO A
      </h1>
      <h1 class="font-display text-5xl md:text-7xl lg:text-8xl font-black text-neon-cyan mb-6 tracking-widest neon-text-glow">
        KYBERA
      </h1>
      <p class="text-gray-300 text-sm md:text-base max-w-lg mx-auto mb-10 leading-relaxed tracking-wide"
         style="text-shadow: 0 0 15px rgba(0,255,255,0.15);">
        Diseñamos y fabricamos sables de luz realistas, interactivos y en 3D
      </p>
      <a href="/configurator" class="landing-cta inline-block animate-pulse hover:animate-none">
        <span class="flex items-center gap-3">
          <!-- Crystal/Gem icon -->
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2L2 9l10 13L22 9l-10-7z"/>
            <path d="M2 9h20"/>
            <path d="M12 22V9"/>
          </svg>
          INICIAR CONSTRUCCIÓN
        </span>
      </a>
    </div>

    <!-- Holographic panels — left and right schematics -->
    <div class="hidden lg:block absolute left-8 top-1/2 -translate-y-1/2 w-48 animate-slide-left" style="animation-delay: 0.3s;">
      <div class="hologram-panel p-4">
        <div class="text-[0.5rem] text-cyan-400/60 tracking-widest mb-2">SCHEMATIC 01</div>
        <div class="border border-cyan-500/10 rounded p-3 flex items-center justify-center" style="height: 100px;">
          <svg class="w-full h-full text-cyan-500/20" viewBox="0 0 120 40" fill="none" stroke="currentColor" stroke-width="0.5">
            <rect x="10" y="15" width="100" height="10" rx="3"/>
            <line x1="25" y1="15" x2="25" y2="25"/>
            <line x1="40" y1="15" x2="40" y2="25"/>
            <line x1="55" y1="15" x2="55" y2="25"/>
            <line x1="70" y1="15" x2="70" y2="25"/>
            <line x1="85" y1="15" x2="85" y2="25"/>
            <circle cx="100" cy="20" r="4"/>
          </svg>
        </div>
        <div class="text-[0.45rem] text-gray-500 tracking-wider mt-2">HILT ASSEMBLY</div>
      </div>
    </div>

    <div class="hidden lg:block absolute right-8 top-1/2 -translate-y-1/2 w-48 animate-slide-right" style="animation-delay: 0.3s;">
      <div class="hologram-panel p-4">
        <div class="text-[0.5rem] text-cyan-400/60 tracking-widest mb-2">SCHEMATIC 02</div>
        <div class="border border-cyan-500/10 rounded p-3 flex items-center justify-center" style="height: 100px;">
          <svg class="w-full h-full text-cyan-500/20" viewBox="0 0 120 40" fill="none" stroke="currentColor" stroke-width="0.5">
            <rect x="10" y="18" width="60" height="4" rx="2"/>
            <rect x="70" y="12" width="40" height="16" rx="8" opacity="0.3"/>
            <line x1="70" y1="20" x2="110" y2="20" stroke-dasharray="2 2"/>
          </svg>
        </div>
        <div class="text-[0.45rem] text-gray-500 tracking-wider mt-2">CRYSTAL CORE</div>
      </div>
    </div>

    <!-- Bottom signature -->
    <div class="absolute bottom-6 left-0 right-0 text-center">
      <span class="font-display text-lg text-cyan-500/15 tracking-[0.5em]">KYBERA</span>
    </div>
  </div>

</body>
</html>
